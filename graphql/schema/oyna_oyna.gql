### QUIZLET ###
type OynaGameQuizlet implements OynaGame {
  id: ID!
  name: String!
  section: Section!
  duration: Int!
  maxPoints: Int!
  createdAt: Int!
  type: OynaGameQuizletType!
  dataType: OynaGameQuizletDataType!
  boards: [[OynaGameQuizletWord]!]!
  submissions: [OynaSubmissionQuizlet!]!
  submission(studentId: ID!): OynaSubmissionQuizlet
  oynaActivity: OynaActivity
}

type OynaGameQuizletWord {
  word: String!
  translation: String
  imageUrl(size: ImageSize! = W1024): String
