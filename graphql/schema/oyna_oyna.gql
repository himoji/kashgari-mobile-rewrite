  createdAt: Int!
  guessed: [[String!]!]!
  game: OynaGameQuizlet!
  student: Student!
  progression: Progression! @deprecated(reason: "not working correctly yet")
  # generateRandomWords: [OynaGameQuizletWord]
}

input OynaSubmissionQuizletInput {
  time: Int!
  guessed: [[String!]!]!
}

input SectionInput {
  grade: Int!
  section: Int!
}

### WORD GAME ###
type OynaGameWordGame implements OynaGame {
  id: ID!
  name: String!
  topic: Topic!
  topicName: String
  duration: Int!
  maxPoints: Int!
  createdAt: Int!
  words: [OynaGameWordGameWord!]!
  onScreenNum: Int!
  recognize: WordGameRecognize!
  drill: WordGameDrill!
  submissions: [OynaSubmissionWordGame!]!
  submission(studentId: ID!): OynaSubmissionWordGame
  oynaActivity: OynaActivity
}

type OynaGameWordGameWord {
  word: String!
  translation: String
  imageUrl(size: ImageSize! = W1024): String
}

type WordGameRecognize {
  shuffle: GameWordShuffle
  complete: GameWordComplete
  tiles: GameTiles
  grid: GameWordGrid
}

type WordGameDrill {
  mcq: [WordGameMCQQuestion!]
  match: [WordGameMatchQuestion!]
  captcha(studentId: ID!, restart: Boolean! = false): WordGameCaptcha
}

type WordGameCaptcha {
  clouds: [WordGameCaptchaCloud!]!
}

type GameWordComplete {
  pairs: [GameWordCompletePair!]!
}

type GameWordCompletePair {
  word: String!
  unfinished: String!
  letters: String!
}

type GameTiles {
  tiles: [GameTile!]!
}

type GameTile {
  word: String!
  correct: Boolean!
}

input OynaGameWordGameInput {
  duration: Int!
  topic: String!
  words: [String!]!
}

type OynaSubmissionWordGame implements OynaSubmission {
  id: ID!
  time: Int!
  points: Int
  createdAt: Int!
  game: OynaGameWordGame!
  student: Student!
  mcq: [WordGameMCQQuestionSubmission!]!
  match: [WordGameMatchQuestionSubmission!]!
  captcha: WordGameCaptchaSubmission!
  progression: Progression! @deprecated(reason: "not working correctly yet")
}

type WordGameMCQQuestion {
  options: [OynaGameWordGameWord!]!
}

type WordGameMatchQuestion {
  word: String!
  translation: String!
}

type WordGameCaptchaCloud {
  word: String!
}

type WordGameMCQQuestionSubmission {
  question: WordGameMCQQuestion!
  answer: String
}

type WordGameMatchQuestionSubmission {
  question: WordGameMatchQuestion!
  answer: String
}

type WordGameCaptchaSubmission {
  correctWords: [String!]!
  studentWords: [String!]!
}

type WordGameCaptchaCloudResult {
  correct: Boolean!
  newCloud: WordGameCaptchaCloud
  left: Int!
}

input OynaSubmissionWordGameInput {
  time: Int
  mcq: [WordGameMCQQuestionInput!]
  match: [WordGameMatchQuestionInput!]
  # captcha
}

input WordGameMCQQuestionInput {
  answer: String!
  studentAnswer: String!
}

input WordGameMatchQuestionInput {
  word: String!
  translation: String!
}

input WordGameCaptchaCloudInput {
  word: String!
}
