type generatedWords {
  word: String!
}

type Query {
  miniStorySearchWords(query: String!, limit: Int!): [String!]!
  miniStoryLastTextsWords(classId: ID!): [String!]!
  miniStoryGame(id: ID!): OynaGameMiniStory
  miniStorySubmission(id: ID!): OynaSubmissionMiniStory

  randomWordleWords(words: [String!]! = [], count: Int! = 1): [generatedWords]
  randomMiniStoryWords(
    words: [String!]! = []
    count: Int! = 1
  ): [generatedWords]
  randomQuizletWords(words: [String!]! = [], count: Int! = 1): [generatedWords]

  wordleSearchWords(query: String!, limit: Int!): [String!]!
  wordleLastTextsWords(classId: ID!): [String!]!
  wordleCheckWord(word: String!): Boolean!
  wordleGame(id: ID!): OynaGameWordle
  wordleSubmission(id: ID!): OynaSubmissionWordle

  quizletSearchWords(query: String!, limit: Int!): [OynaGameQuizletWord!]!
  quizletLastTextsWords(classId: ID!): [OynaGameQuizletWord!]!
  quizletGame(id: ID!): OynaGameQuizlet
  quizletSubmission(id: ID!): OynaSubmissionQuizlet

  wordGameSearchWords(query: String!, limit: Int!): [OynaGameWordGameWord!]!
  wordGameSearchTopics(query: String!, limit: Int!): [Topic!]!
  wordGameTopicWords(topic: String!): [OynaGameWordGameWord!]!
  wordGameCheckWord(topic: String!, word: String!): Boolean!
  wordGameGame(id: ID!): OynaGameWordGame
  wordGameSubmission(id: ID!): OynaSubmissionWordGame
  wordGameTopicRecommendations(classId: ID!): [Topic!]!
  wordGameDefaultTopic(classId: String!): String
}

type Mutation {
  miniStoryCreate(
    classId: ID!
    data: OynaGameMiniStoryInput!
    lessonId: ID
    index: Int
  ): OynaGameMiniStory
  miniStoryUpdate(gameId: ID!, data: OynaGameUpdateInput!): OynaGameMiniStory
  miniStorySubmit(
    gameId: ID!
    studentId: ID!
    data: OynaSubmissionMiniStoryInput!
  ): OynaSubmissionMiniStory
  miniStoryGrade(submissionId: ID!, points: Int!): OynaSubmissionMiniStory
  miniStoryDelete(id: ID!): Boolean

  wordleCreate(
    classId: ID!
    data: OynaGameWordleInput!
    lessonId: ID
    index: Int
  ): OynaGameWordle
  wordleUpdate(gameId: ID!, data: OynaGameUpdateInput!): OynaGameWordle
  wordleSubmit(
    gameId: ID!
    studentId: ID!
    data: OynaSubmissionWordleInput!
  ): OynaSubmissionWordle
  wordleDelete(id: ID!): Boolean

  quizletCreate(
    classId: ID!
    data: OynaGameQuizletInput!
    lessonId: ID
    index: Int
  ): OynaGameQuizlet
  quizletUpdate(gameId: ID!, data: OynaGameUpdateInput!): OynaGameQuizlet
  quizletSubmit(
    gameId: ID!
    studentId: ID!
    data: OynaSubmissionQuizletInput!
  ): OynaSubmissionQuizlet
  quizletDelete(id: ID!): Boolean

  wordGameCreate(
    classId: ID!
    data: OynaGameWordGameInput!
    lessonId: ID
    index: Int
  ): OynaGameWordGame
  wordGameSubmit(
    gameId: ID!
    studentId: ID!
    data: OynaSubmissionWordGameInput!
  ): OynaSubmissionWordGame
  wordGameCaptchaCloudSubmit(
    gameId: ID!
    studentId: ID!
    data: WordGameCaptchaCloudInput!
  ): WordGameCaptchaCloudResult
  wordGameDelete(id: ID!): Boolean
}

interface OynaGame {
  id: ID!
  name: String!
  # section: Section!
  duration: Int!
  maxPoints: Int!
  createdAt: Int!
  submissions: [OynaSubmission!]!
  submission(studentId: ID!): OynaSubmission
  oynaActivity: OynaActivity
}

interface OynaSubmission {
  id: ID!
  time: Int!
  points: Int
  createdAt: Int!
  game: OynaGame!
  student: Student!
  progression: Progression! @deprecated(reason: "not working correctly yet")
}

