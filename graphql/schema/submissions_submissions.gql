input SubmissionCompleteV2Input {
  sentences: [SubmissionCompleteV2SentenceInput!]!
}

input SubmissionCompleteV2SentenceInput {
  before: String!
  after: String!
  word: String!
}

# TRUE/FALSE
type SubmissionTrueFalse {
