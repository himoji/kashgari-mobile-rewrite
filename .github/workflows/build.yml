name: Build and Submit
on:
  push:
    branches:
      - main
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Checkout repo
        uses: actions/checkout@v4
      # - name: Cache dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.bun/install/cache
      #     key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run linter
        run: bun run lint
  build-android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Claim disk space
        run: |
          # Remove unused tools
          sudo rm -rf /opt/microsoft                #   783M
          sudo rm -rf /usr/lib/llvm-*               #  1900M
          sudo rm -rf /usr/local/julia*             #  1008M
          sudo rm -rf /usr/local/share/chromium     #   613M
          sudo rm -rf /usr/local/share/powershell   #  1244M
          sudo rm -rf /usr/share/swift              #  3207M
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: bun
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Checkout repo
        uses: actions/checkout@v4
      # - name: Cache dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.bun/install/cache
      #     key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create google-services.json
        run: echo ${{ secrets.GOOGLE_SERVICES_JSON }} | base64 -d > google-services.json
      - name: Run build
        run: eas build --local -p android --output=app.aab --non-interactive
      - name: Submit to Google Play
        run: eas submit -p android --path=app.aab --no-wait --verbose --verbose-fastlane --non-interactive
